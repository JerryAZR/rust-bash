[package]
name = "rust-bash"
version = "0.8.0"
edition = "2024"
description = "A sandboxed bash interpreter for AI Agents with a virtual filesystem"
license = "MIT"
keywords = ["bash", "shell", "interpreter", "sandbox", "virtual-filesystem"]
categories = ["command-line-utilities", "development-tools", "parser-implementations", "emulators"]
repository = "https://github.com/JerryAZR/rust-bash"
readme = "README.md"
exclude = [
    ".github/",
    "docs/plans/",
    "AGENTS.md",
]

[features]
default = ["native-fs"]
native-fs = []
# Sandboxed CPython (wasm32-wasip1 under wasmtime) sharing the VirtualFs.
# Off by default for downstream consumers; CI and local test runs use
# --all-features and MUST exercise it.
python = ["dep:async-trait", "dep:wasi-common", "dep:wasmtime"]

[[example]]
name = "agent_harness"
required-features = ["native-fs"]

[[example]]
name = "python_wasm"
required-features = ["python"]

[[example]]
name = "python_overlay"
required-features = ["python", "native-fs"]

[dependencies]
getrandom = "0.4"
async-trait = { version = "0.1.89", optional = true }
base64 = "0.22"
bitflags = "2.11.0"
brush-parser = {git = "https://github.com/reubeno/brush.git", rev = "ae35b6dd09f394c66fd805bea747e35a013ee978"}
chrono = "0.4"
chrono-tz = "0.10.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jaq-core = "3.1.0"
jaq-json = "2.0.2"
jaq-std = "3.0.2"
md-5 = "0.10"
parking_lot = "0.12.5"
regex = "1.12.3"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
similar = "2.7.0"
tar = "0.4"
wasi-common = { version = "46.0.3", optional = true }
wasmtime = { version = "46.0.3", optional = true }

[dev-dependencies]
datatest-stable = "0.3.3"
insta = { version = "1.46.3", features = ["filters"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.0.7"
toml_edit = "0.25.5"

[[test]]
name = "comparison"
harness = false

[[test]]
name = "spec_tests"
harness = false

[[test]]
name = "oils_spec"
harness = false
